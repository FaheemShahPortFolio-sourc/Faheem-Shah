<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Syed Faheem Shah Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatCard {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: fadeInDown 0.8s ease-out;
        }

        nav h1 {
            margin: 0;
            padding: 20px 0 15px 0;
            color: #00ffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-size: 1.8rem;
        }

        nav ul {
            margin: 0;
            padding: 0 0 15px 0;
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav li a {
            text-decoration: none;
            color: #cbd5e1;
            padding: 8px 18px;
            font-weight: 600;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav li a:hover,
        nav li a.active {
            color: #000;
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff;
            transform: translateY(-2px);
        }

        .hero {
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
        }

        .hero-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.1);
            max-width: 700px;
            width: 100%;
            animation: fadeInUp 1s ease-out, floatCard 6s ease-in-out infinite;
        }

        .hero-card:hover {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 255, 255, 0.4);
            border-color: #00ffff;
        }

        .hero h2 {
            font-size: 2.5rem;
            color: #00ffff;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        .hero p {
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            color: #cbd5e1;
        }

        .hero strong {
            color: #00ffff;
        }
    </style>
</head>

<body>
    <nav>
        <h1>MY PORTFOLIO</h1>
        <ul>
            <li><a href="Home.html" class="active">Home</a></li>
            <li><a href="Services.html">Services</a></li>
            <li><a href="Experinece.html">Experience</a></li>
            <li><a href="About.html">About</a></li>
        </ul>
    </nav>

    <div class="hero">
        <div class="hero-card">
            <h2>Welcome To My Portfolio</h2>
            <p>Hi, I am <strong>Syed Faheem Shah</strong>. I am a Computer Science student passionate about Front-End
                Development, AI, and continuous learning.</p>
        </div>
    </div>
</body>

</html>
